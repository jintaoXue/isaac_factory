params:
  seed: 42
  algo:
    name: hier

  env:
    clip_observations: 5.0
    clip_actions: 1.0

  config:
    name: HcFactory
    env_name: rlgpu_HRTPA
    device: 'cuda:0'
    device_name: 'cuda:0'
    time_str: "None"

    # Overridden by train.py from --num_envs / env.num_envs
    num_actors: 1
    max_episodic_steps: 25000
    state_dim: 256

    gamma: 0.998
    learning_rate: 1.0e-4
    encoder_learning_rate: 1.0e-4
    batch_size: 64
    replay_buffer_size: 50000
    hidden_dim: 128
    target_update_interval: 500
    # required by rl_games Runner.load (unused by HierarchicalTPA)
    reward_shaper:
      scale_value: 1.0

    # epsilon-greedy exploration
    epsilon_start: 1.0
    epsilon_end: 0.0
    epsilon_decay_steps: 200000

    # training loop (learn_interval: DQN backward every N env steps; buffer stores every decision step)
    learn_interval: 8
    save_interval: 5000
    log_interval: 100
    parallel_producing_limit: 5
    max_parallel_cd_dispatch: 5

    test: False
    test_times: 1
    test_seeds: [42, 43, 44, 45, 46]
    test_epsilon: 0.0
    env_rule_based_exploration: False
    makespan_window: 50
    wandb_activate: False
    wandb_project: 'HcFactory_Hier'

    load_dir: ''
    load_name: ''

    # Horizon / catalog / curriculum (see 2026_Journal_Paper §5)
    explore: False
    explore_catalog: False
    explore_catalog_dir: ''
    warmstart: ''
    curriculum: False
    curriculum_start_stage: 0
    t_max_anchor: 25000
    stagnation_l1: 400
    stagnation_l2: 600
    stagnation_l3: 800
    decision_ring_k: 20
