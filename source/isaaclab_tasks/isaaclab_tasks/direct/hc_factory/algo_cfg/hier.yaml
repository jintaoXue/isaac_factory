params:
  seed: 42
  algo:
    name: hier

  env:
    clip_observations: 5.0
    clip_actions: 1.0

  config:
    name: HcFactory
    env_name: rlgpu_HRTPA
    device: 'cuda:0'
    device_name: 'cuda:0'
    time_str: "None"

    # Overridden by train.py from --num_envs / env.num_envs
    num_actors: 1
    max_episodic_steps: 64000
    state_dim: 256

    # Per-simulation-step discount used as gamma ** decision_duration.
    gamma: 0.9999
    # Scale the accumulated SMDP return before replay (episode logs remain unscaled).
    decision_reward_scale: 0.01
    learning_rate: 1.0e-4
    encoder_learning_rate: 1.0e-4
    batch_size: 64
    replay_buffer_size: 50000
    # A acts only on product admission, so its replay grows much slower than B/C/D.
    batch_size_A: 16
    replay_buffer_size_A: 5000
    hidden_dim: 128
    target_update_interval: 2000
    double_dqn: True
    target_tau: 0.005
    # Reduce update aggressiveness once epsilon reaches its floor.
    late_stability_step: 1500000
    late_learning_rate: 2.0e-5
    late_encoder_learning_rate: 2.0e-5
    late_target_tau: 0.001
    huber_delta: 1.0
    grad_clip_norm: 10.0
    reward_clip: 100.0
    q_target_clip: 500.0
    # T1R: Rainbow subset — Double (on) + PER + Dueling (Noisy optional, default off)
    prioritized_replay: False
    per_alpha: 0.6
    per_beta_start: 0.4
    per_beta_frames: 1000000
    per_eps: 1.0e-6
    dueling_dqn: False
    noisy_net: False
    noisy_std: 0.5
    # T1RH: layered credit + B-score RL emphasis
    hierarchical_credit: False
    credit_scale_A: 2.0
    credit_scale_B: 1.5
    credit_scale_CD: 1.0
    b_score_rl: False
    algo_variant: T0
    # required by rl_games Runner.load (unused by HierarchicalTPA)
    reward_shaper:
      scale_value: 1.0

    # epsilon-greedy exploration
    epsilon_start: 1.0
    epsilon_end: 0.05
    epsilon_decay_steps: 1500000

    # training loop (learn_interval: DQN backward every N env steps; buffer stores every completed decision interval)
    learn_interval: 8
    save_interval: 5000
    log_interval: 100
    parallel_producing_limit: 10
    max_parallel_cd_dispatch: 10
    # C none handling: always (Rule-aligned, safe for greedy eval) | staging_only
    c_forbid_none_mode: always

    test: False
    test_times: 1
    test_seeds: [42, 43, 44, 45, 46]
    test_epsilon: 0.0
    test_progress_log_interval: 100
    env_rule_based_exploration: False
    makespan_window: 50
    wandb_activate: False
    wandb_project: 'HcFactory_Hier'

    load_dir: ''
    load_name: ''

    # Horizon / catalog / curriculum (see 2026_Journal_Paper §5)
    explore: False
    explore_catalog: False
    explore_catalog_dir: ''
    explore_n_products: 0
    explore_save_catalog: True
    explore_save_offline_replay: True
    offline_replay_capacity: 100000
    offline_replay_capacity_A: 20000
    catalog_collect: False
    warmstart: ''
    curriculum: False
    curriculum_start_stage: 0
    t_max_anchor: 64000
    # ORU (T1/T2): offline warmup then decaying mix into online hard train
    oru: False
    oru_warmup_updates: 0          # 0 = auto from offline size (≈5 epochs, clipped)
    oru_warmup_epochs: 5.0
    oru_warmup_min: 2000
    oru_warmup_max: 15000
    oru_mix_start: 1.0             # right after warmup
    oru_mix_decay_env_steps: 300000  # linear 1→0 over this many env steps
    oru_shrink_offline: True       # shrink offline buffer with mix_ratio
    stagnation_l1: 400
    stagnation_l2: 600
    stagnation_l3: 800
    decision_ring_k: 20
