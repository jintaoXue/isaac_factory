params:
  seed: 42
  algo:
    name: hier

  env:
    clip_observations: 5.0
    clip_actions: 1.0

  config:
    name: HcFactory
    env_name: rlgpu_HRTPA
    device: 'cuda:0'
    device_name: 'cuda:0'
    time_str: "None"

    # Must match HcVectorEnvCfg.scene.num_envs
    num_actors: 3
    max_episode_steps: 15000
    state_dim: 256

    gamma: 0.99
    learning_rate: 1.0e-4
    max_epochs: 1.0e+11
    batch_size: 64
    replay_buffer_size: 50000
    hidden_dim: 128
    target_update_interval: 500
    # required by rl_games Runner.load (unused by HierarchicalTPA)
    reward_shaper:
      scale_value: 1.0

    # epsilon-greedy exploration
    epsilon_start: 1.0
    epsilon_end: 0.05
    epsilon_decay_steps: 100000

    # training loop
    learn_interval: 1
    save_interval: 5000
    log_interval: 100
    parallel_producing_limit: 5

    test: False
    env_rule_based_exploration: False
    makespan_window: 50
    wandb_activate: False
    wandb_project: 'HcFactory_Hier'

    load_dir: ''
    load_name: ''
